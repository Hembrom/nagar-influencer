<svg viewBox="0 0 1280 420" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
      .logo-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 900;
        font-size: 140px;
        line-height: 1;
      }
      .influence-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 900;
        font-size: 120px;
        line-height: 1;
      }
    </style>
  </defs>
  
  <!-- Leaves Group (Green) -->
  <g transform="translate(420, 80)">
    <!-- Main large leaf -->
    <path d="M 0 -50 Q 30 -20 35 20 Q 30 45 0 55 Q -30 45 -35 20 Q -30 -20 0 -50" fill="#16a34a"/>
    <!-- Left small leaf -->
    <path d="M -35 -15 Q -50 0 -45 25 Q -35 35 -15 30 Q -25 15 -35 -15" fill="#22c55e"/>
    <!-- Right small leaf -->
    <path d="M 35 -15 Q 50 0 45 25 Q 35 35 15 30 Q 25 15 35 -15" fill="#059669"/>
    <!-- White center vein on main leaf -->
    <path d="M 0 -45 Q 3 0 0 50" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- First line: "Grow" + circle "my" -->
  <g>
    <!-- "Gr" in dark blue -->
    <text x="60" y="200" class="logo-text" fill="#001f5c" letter-spacing="-3">Gr</text>
    
    <!-- Circle background for "o" -->
    <circle cx="425" cy="145" r="65" fill="#e63946"/>
    <!-- White "o" in circle -->
    <text x="380" y="210" class="logo-text" fill="white" letter-spacing="-3">o</text>
    
    <!-- "w" in dark blue -->
    <text x="480" y="200" class="logo-text" fill="#001f5c" letter-spacing="-3">w</text>
    
    <!-- "my" in yellow -->
    <text x="650" y="200" class="logo-text" fill="#fbbf24" letter-spacing="-3">my</text>
  </g>
  
  <!-- Second line: "Influence" in dark blue -->
  <g>
    <text x="60" y="340" class="influence-text" fill="#001f5c" letter-spacing="-2">Influence</text>
  </g>
</svg>
